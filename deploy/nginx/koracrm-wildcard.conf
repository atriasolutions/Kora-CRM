# Kora CRM — Nginx multi-tenant (*.koracrm.cl)
# Copiar a /etc/nginx/sites-available/koracrm y enlazar en sites-enabled.
# Requiere certificado wildcard: certbot certonly --dns-digitalocean -d koracrm.cl -d '*.koracrm.cl'

upstream kora_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name koracrm.cl www.koracrm.cl *.koracrm.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name koracrm.cl www.koracrm.cl *.koracrm.cl;

    ssl_certificate     /etc/letsencrypt/live/koracrm.cl-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koracrm.cl-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kora-crm/frontend/dist;
    index index.html;

    client_max_body_size 25m;

    # API — Host se reenvía para resolver tenant por subdominio
    location /api/ {
        proxy_pass http://kora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location /ws {
        proxy_pass http://kora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA — index.html sin cache para desplegar JS nuevo de inmediato
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # PWA
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tras migración multi-tenant: usuarios autenticados en apex pueden ir a subdominio Atria
    location = /inicio {
        try_files $uri $uri/ /index.html;
    }
}
